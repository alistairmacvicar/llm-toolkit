[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-toolkit"
dynamic = ["version"]
description = "Python package to make building LLM apps easier."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm",
    "numpydoc",
    "numpy",
    "opencv-python",
    "pynput",
    "sounddevice",
    "soundfile",
    "websockets",
]

[tool.setuptools.dynamic]
version = {attr = "llm_toolkit.__about__.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
