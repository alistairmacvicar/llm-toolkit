name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      RUN_LIVE_TESTS: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install media system libraries
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1 libgl1 libglib2.0-0
      - name: Install library and test tools
        run: python -m pip install -e '.[dev]'
      - name: Run offline tests
        run: python -m pytest
      - name: Build wheel and source distribution
        if: matrix.python == '3.12'
        run: python -m build
